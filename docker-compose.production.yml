# docker-compose.production.yml
# Production configuration for Coolify deployment
#
# Usage with Coolify:
# 1. Set this as your docker-compose file in Coolify
# 2. Configure environment variables in Coolify dashboard:
#    - DATABASE_URL (or use the built-in Postgres)
#    - Any other env vars as needed
#
# Or run standalone:
#   docker compose -f docker-compose.production.yml up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ephemera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ephemera}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ephemera} -d ${POSTGRES_DB:-ephemera}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Uncomment to expose port for external access
    # ports:
    #   - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-ephemera}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ephemera}
      # App configuration - override in Coolify environment
      # DEV_ADMIN_USER: (not needed in production)
      # DEV_ADMIN_PASS: (not needed in production)
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
