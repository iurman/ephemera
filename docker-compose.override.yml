# docker-compose.override.yml
# Local development overrides — automatically merged with docker-compose.yml
# when running `docker compose up` locally. Not used by Coolify.
#
# For plain local development without containers, prefer:
#   docker compose -f docker-compose.dev.yml up -d   # database only
#   npm run db:migrate && npm run dev
services:
  db:
    image: postgres:16 # full image for better dev tooling
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      target: deps # dev deps + npm available; source comes from the mount
    environment:
      NODE_ENV: development
    ports:
      - "3005:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "node scripts/migrate.mjs && npx next dev -p 3000"
