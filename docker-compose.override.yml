# docker-compose.override.yml
# Local development overrides - automatically merged with docker-compose.yml
#
# This file is NOT used by Coolify or production deployments.
# It's only applied when running `docker compose up` locally.
#
# Usage:
#   POSTGRES_PASSWORD=dev docker compose up      # Starts app + db with dev settings
#   docker compose down                          # Stops everything

services:
  db:
    image: postgres:16  # Use full image for better dev tooling
    ports:
      - "5432:5432"     # Expose for local DB tools

  app:
    environment:
      NODE_ENV: development
    ports:
      - "3005:3000"     # Different port to avoid conflicts
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run drizzle:push -- --force && npm run dev"
