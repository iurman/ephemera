# docker-compose.override.yml
# Local development overrides - automatically merged with docker-compose.yml
#
# This file is NOT used by Coolify or production deployments.
# It's only applied when running `docker compose up` locally.
#
# Usage:
#   docker compose up      # Starts app + db with dev settings
#   docker compose down    # Stops everything

services:
  # Development database
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: drops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d drops"]
      interval: 2s
      timeout: 2s
      retries: 20

  # Override app settings for development
  app:
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://dev:dev@db:5432/drops
    ports:
      - "3005:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run drizzle:push -- --force && npm run dev"

volumes:
  pgdata:
