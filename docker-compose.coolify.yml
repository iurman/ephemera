# docker-compose.coolify.yml
# Simplified configuration for Coolify with external database
#
# Use this when:
# - Using Coolify's built-in Postgres
# - Using an external database service
# - You want a single-container deployment
#
# Required environment variables (set in Coolify):
# - DATABASE_URL: Full postgres connection string

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-false}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
