# docker-compose.yml
# Production configuration for Coolify and PaaS deployments
#
# This file deploys both the app and PostgreSQL database together.
# For local development, docker-compose.override.yml is automatically merged.
#
# Required environment variables (set in your PaaS dashboard):
# - POSTGRES_PASSWORD: Password for the database (required)
#
# Optional environment variables:
# - POSTGRES_USER: Database user (default: ephemera)
# - POSTGRES_DB: Database name (default: ephemera)
# - HOST_PORT: External port to expose (default: 3000)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ephemera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ephemera}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ephemera} -d ${POSTGRES_DB:-ephemera}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Uncomment to expose port for external access
    # ports:
    #   - "5432:5432"

  app:
    container_name: ephemera-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    expose:
      - "3000"
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.ephemera.rule=Host(`ephemera.isaacurman.com`)"
      - "traefik.http.routers.ephemera.entrypoints=https"
      - "traefik.http.routers.ephemera.tls=true"
      - "traefik.http.routers.ephemera.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ephemera.service=ephemera"
      # HTTP router with redirect to HTTPS
      - "traefik.http.routers.ephemera-http.rule=Host(`ephemera.isaacurman.com`)"
      - "traefik.http.routers.ephemera-http.entrypoints=http"
      - "traefik.http.routers.ephemera-http.middlewares=redirect-to-https"
      - "traefik.http.routers.ephemera-http.service=ephemera"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      # Service configuration
      - "traefik.http.services.ephemera.loadbalancer.server.port=3000"
      - "traefik.docker.network=coolify"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-ephemera}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ephemera}
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  default:
  coolify:
    external: true
