# docker-compose.yml
# Production configuration for Coolify and PaaS deployments
#
# This file is the default used by Coolify and other deployment platforms.
# For local development, docker-compose.override.yml is automatically merged.
#
# Required environment variables (set in your PaaS dashboard):
# - DATABASE_URL: Full postgres connection string

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-false}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
